[project]
name = "aureon-api"
version = "0.1.0"
description = "Aureon Demo backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "celery==5.6.3",
    "httpx==0.28.1",
    "pyjwt==2.15.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
