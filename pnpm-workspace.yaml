packages:
  - "apps/web"
  - "packages/*"

# Packages allowed to run install scripts (native binaries for build/lint tooling)
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  # next-intl transitive deps (message-extraction tooling only, not used at runtime/build)
  '@parcel/watcher': false
  '@swc/core': false
  # core-js postinstall only prints a funding banner; not needed at runtime/build (jspdf transitive)
  core-js: false
