# Root uv workspace — lets every backend command in CLAUDE.md § Commands run from repo root
# (`uv run uvicorn app.main:app`, `uv run pytest`, `uv run alembic ...`). DEC-071: package `app`
# lives in apps/api/src/app.

[project]
name = "aureon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aureon-api"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]
# DEC-120 (resolved, user-approved 2026-10-19): document-generation libraries for the
# 7 demo sample documents (T-401). Used only by scripts/gen_demo_docs.py, not by API runtime.
demo = [
    "openpyxl==3.1.5",
    "python-docx==1.1.2",
    "reportlab==4.2.5",
    "pillow==11.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
aureon-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
# Exclude live external-service tests by default so `uv run pytest` is reproducible offline/CI.
# Run them explicitly with `RUN_LIVE_TESTS=true uv run pytest -m live`.
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "contract: API contract checks against docs/3.EXECUTION/10-API-SPECIFICATION.md (pnpm contract:validate)",
    "integration: needs docker compose services (postgres/redis/minio)",
    "live: hits a live external service (OmniRoute localhost:20128); excluded by default (-m 'not live'), run with RUN_LIVE_TESTS=true -m live",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests"]
extend-exclude = ["node_modules", ".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests use throwaway literal secrets.
"apps/api/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src"
files = ["apps/api/src/app"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
