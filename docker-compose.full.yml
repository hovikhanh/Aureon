# Aureon v2.1 — FULL demo stack (T-513): 9 services, production-like.
#   cp .env.example .env   # fill dev values; never commit .env
#   ./scripts/generate_keys.sh   # RS256 pair → ./keys (gitignored)
#   docker compose -f docker-compose.full.yml up -d --build
#   open http://localhost:3000
# API: http://localhost:4000/health · Same project name as docker-compose.yml → shares the
# seeded volumes. WARNING: never `down -v` on a seeded demo; use scripts/demo_reset.sh.

name: aureon

x-backend: &backend
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: aureon-api:local
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    # In-network hostnames override the localhost values used by host-side dev.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    S3_ENDPOINT: http://minio:9000
    OLLAMA_BASE_URL: http://ollama:11434
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"
    # OmniRoute (build/runtime LLM gateway) runs on the host, outside this stack.
    OMNIROUTE_BASE_URL: ${OMNIROUTE_DOCKER_URL:-http://host.docker.internal:20128/v1}
    JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
    JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./keys:/app/keys:ro
    # Bind mount so host scripts (demo_reset, E2E seed) see the same IDP objects.
    - ./var/idp-storage:/app/var/idp-storage
  networks: [aureon-net]
  depends_on: &backend-deps
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [aureon-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    networks: [aureon-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest  # DEC-114
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio_data:/data]
    networks: [aureon-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:  # DEC-142 bge-m3 + qwen2.5:7b-instruct (CONFIDENTIAL local chat)
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    volumes: [ollama_data:/root/.ollama]
    networks: [aureon-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  clamav:  # DEC-138 — first start downloads signatures (a few minutes)
    image: clamav/clamav:latest
    container_name: clamav
    restart: unless-stopped
    ports: ["${CLAMAV_PORT:-3310}:3310"]
    volumes: [clamav_data:/var/lib/clamav]
    networks: [aureon-net]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s

  api:
    <<: *backend
    # Migrate + idempotent seed (DEC-062) then serve. Safe on every restart.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 4000 --proxy-headers"]
    ports: ["${API_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:4000/health/ready', timeout=4).status != 200)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 60s

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "-Q", "default,idp,events"]
    depends_on:
      <<: *backend-deps
      api:
        condition: service_healthy  # schema migrated before consuming
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  celery-beat:
    <<: *backend
    # Exactly ONE beat instance (CLAUDE.md §6.5) — never scale this service.
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "-s", "/tmp/celerybeat-schedule"]
    deploy:
      replicas: 1
    depends_on:
      <<: *backend-deps
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -mmin -5)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_DEMO_REFERENCE_DATE: ${DEMO_REFERENCE_DATE:-2026-10-20}
    image: aureon-web:local
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://api:4000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports: ["${WEB_PORT:-3000}:3000"]
    networks: [aureon-net]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 30s

networks:
  aureon-net:
    name: aureon-net

volumes:
  pg_data:
  redis_data:
  minio_data:
  ollama_data:
  clamav_data:
