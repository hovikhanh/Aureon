# CI for Aureon v2 (09 T-017, DEC-177).
#   secrets: gitleaks over the full git history — any finding fails the run (blocks merge).
#   web:     lint + typecheck + unit test + Next.js build (apps/web returns with the FE tasks).
#   api:     ruff + mypy + alembic migrate + seed + pytest with coverage gate (fixture mode,
#            `-m "not live"`) + contract suite.
# No secrets are used: every value below is a non-sensitive CI test placeholder (CLAUDE.md §6.4).
# JWT keys: RS256 test keys are generated in-process by tests/conftest.py (no HS256 JWT_SECRET).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the tip

      # Pinned CLI image (no third-party action / license key). Reviewed false positives live in
      # .gitleaksignore (fingerprints only).
      - name: gitleaks detect
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.3
          git --redact --no-banner --exit-code 1 .

  web:
    name: web (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build:web

  api:
    name: api (ruff / mypy / migrate / seed / pytest / contract)
    runs-on: ubuntu-latest

    # Non-secret CI test values only — never real credentials, never a committed .env.
    env:
      DATABASE_URL: postgresql+psycopg://aureon:ci-test-pass@localhost:5432/aureon
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_ISSUER: aureon
      JWT_AUDIENCE: aureon-api
      MODEL_GATEWAY_MODE: fixture
      OMNIROUTE_BASE_URL: http://localhost:20128/v1
      DEMO_MODE: "true"
      DEMO_PASSWORD: ci-test-pass  # fallback for all 10 demo accounts (08 §2)

    needs: secrets
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aureon
          POSTGRES_PASSWORD: ci-test-pass
          POSTGRES_DB: aureon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aureon -d aureon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # pnpm is needed only to run the `contract:validate` package.json script (it shells out to
      # `uv run pytest -m contract`); no JS install is required for the api job.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      # Migrate + seed (idempotent, DEC-062/DEC-178). RS256 keys for the seed-time app import
      # are not needed — signing keys are only loaded on first token use.
      - name: Alembic migrate
        run: uv run alembic upgrade head

      - name: Seed demo data
        run: uv run python -m app.seed

      - name: Seed is idempotent (second run)
        run: uv run python -m app.seed

      # NFR-16 / 14 §1.3: backend ≥ 75% overall (current ≈ 98%); per-module service ≥ 80% is
      # reviewed in the coverage report.
      - name: Pytest + coverage gate (fixture mode, no live providers)
        run: uv run pytest -m "not live" --cov=app --cov-report=term --cov-fail-under=75

      - name: Contract validation
        run: pnpm contract:validate
