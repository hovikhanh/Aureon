# Aureon v4 — default Compose file. It includes the ONE stack definition, `docker-compose.full.yml`,
# so these are the same thing and manage the same containers, network and volumes:
#   docker compose up -d            ==  docker compose -f docker-compose.full.yml up -d
#   docker compose ps / logs / ...
# Infra only (host-side development, `pnpm dev`): docker compose up -d postgres redis minio ollama clamav mailpit
#
# Why (2026-11-09): this file used to define its own postgres/redis/... on the default network
# with the same project name `aureon`. A plain `docker compose up -d` then re-created those
# containers on `aureon_default` while api/web stayed on `aureon-net` → the API lost its database
# and every login failed. One definition removes that trap.
#
# WARNING: never `docker compose down -v` on the demo — it deletes the named volumes (all data).

name: aureon

include:
  - docker-compose.full.yml
